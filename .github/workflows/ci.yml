# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# Primary CI gate. Runs on every push/PR. Wall-time target: <5 min.
#
# Phase order (cancel-on-failure):
#   1. lint        — fmt + clippy (~1 min)        BLOCKS everything
#   2. test        — lib + integration in matrix  PARALLEL after lint
#   3. examples    — heavy end-to-end builds      PARALLEL after lint
#   4. coverage    — gate at 98% region floor      PARALLEL after lint
#   5. audit       — cargo-deny supply chain      PARALLEL after lint
#
# Heavy / scheduled work (a11y, sbom, full multi-OS portability matrix)
# lives in scheduled.yml.

name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  RUST_BACKTRACE: short
  # Floors raised v0.0.45 (#583) after the coverage lift (~90 new tests
  # across rpc_schema, cmd::audit, edge_headers, mcp, isr_manifest,
  # dev_server, lib.rs, search, audit::output::json, iso20022, audit::mod,
  # cmd::error, broken_links, accessibility, plus serde_json refactor
  # in plugin/sbom/accessibility/json formatters).
  #
  # Gate uses `cargo llvm-cov --lib` to keep example_outputs.rs
  # integration tests (which run real `ssg build` invocations with their
  # own timeouts in the `examples` job) out of the instrumented run.
  # Why 98.0 and not 100, and not 80.
  #
  # Measured coverage at the time this floor was set was 99.3%. A floor
  # is a ratchet against regression, not a target to chase: set at 100 it
  # fails on any untestable line and gets lowered under pressure; set at
  # 80 it permits a fifth of the library to rot untested. 98.0 sits just
  # below the real number, so it catches a genuine drop while leaving
  # room for the handful of lines that are legitimately hard to reach.
  #
  # Two modules are excluded rather than counted and forgiven, so the
  # number means what it says: src/core/deploy_adapter.rs (six adapters
  # documented as not yet implemented, #527) and src/main.rs (argv
  # dispatch, covered by running the binary in tests/cli_subcommands.rs
  # rather than by cargo llvm-cov).
  #
  # Raise it when the real number rises; never lower it to make a red
  # build green.
  COVERAGE_REGIONS_FLOOR: "98.0"
  COVERAGE_LINES_FLOOR: "98.0"
  COVERAGE_FUNCTIONS_FLOOR: "98.0"

jobs:
  # ── Phase 0: repo hygiene (issue #556) ──────────────────────────────
  # Fast gate (~5 s, no toolchain) that fails if coverage detritus or
  # other build artefacts leak into the working tree. Runs in parallel
  # with `lint` so it can't be skipped by a clippy failure.
  repo-hygiene:
    name: repo hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Extracted to a script so `./scripts/repo-hygiene.sh` reproduces
      # this job exactly — see DEVELOPMENT.md.
      - name: Repository hygiene
        run: ./scripts/repo-hygiene.sh

  # ── Phase 1: lint (blocks downstream) ───────────────────────────────
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    # Was 5m; bumped to 15m in v0.0.46 because the
    # `feature powerset check` step does an uncached
    # `cargo install --locked cargo-hack` (~3m compile) plus the
    # powerset itself, which routinely landed at 5m15s on a cold
    # cache and got timeout-cancelled. 15m matches the test job.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: lint

      - name: Install ripgrep (#558, #557, #584)
        # Required by tools/lint-no-shellout.sh and tools/lint-adr.sh.
        # ubuntu-latest doesn't preinstall rg — adding ~1s for apt.
        run: sudo apt-get install -y ripgrep

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy (lib — strict)
        run: cargo clippy --lib --all-features -- -D warnings

      - name: cargo clippy (tests + examples)
        # Tests/examples allow `unwrap`/`expect` for brevity — see Cargo.toml
        # `[lints.clippy]` for the full allowance rationale.
        run: |
          cargo clippy --lib --tests --examples --all-features -- \
            -D warnings \
            -A clippy::unwrap_used \
            -A clippy::expect_used

      - name: no shellout regression (#558)
        # Refuses Command::new("<shell-binary>") in src/ or crates/.
        # Regression guard for v0.0.44 LlmPlugin port from curl to ureq (#520).
        run: ./tools/lint-no-shellout.sh

      - name: ADR citation graph (#557)
        # Refuses dangling `adr: ADR-NNNN` citations in tracked source.
        # Every cited ADR must resolve to a file in docs/adr/.
        run: ./tools/lint-adr.sh

      - name: feature powerset check (#584)
        # cargo-hack runs `cargo check` across every reachable subset
        # of the feature flags (45 combinations at v0.0.45). Catches
        # cfg-gating gaps where helper items become dead under
        # --no-default-features. `--depth 2` keeps the runner cost
        # bounded; full powerset (`--depth N`) is exponential.
        run: |
          cargo install --locked cargo-hack
          cargo hack check --feature-powerset --depth 2 --no-dev-deps

  # ── Phase 2a: unit + integration tests (3-OS matrix) ────────────────
  test:
    name: test · ${{ matrix.os }} · ${{ matrix.toolchain }}
    needs: lint
    runs-on: ${{ matrix.os }}
    # beta is an early warning, not a gate: a nightly-track regression in
    # a dependency should tell us, not block a release.
    continue-on-error: ${{ matrix.experimental || false }}
    # Bumped 8 → 15 in v0.0.42 (ravif AVIF encoding, ~1.2s per 1024×768
    # image on the runner) and 15 → 20 after windows-latest started being
    # cancelled at exactly 15m00s.
    #
    # Almost all of that is compilation, not tests: on the run that hit
    # the ceiling, Windows finished 3,491 lib tests in 35s having already
    # spent ~14m50s building. A cancelled job therefore says nothing
    # about the code, which is the worst kind of red — it reads as a test
    # failure and is not one.
    #
    # Observed Windows wall-time is 9-10m on a warm cache and 14-15m cold,
    # so 15 left no margin for ordinary variance. 20 absorbs that while
    # still failing a genuinely hung job.
    #
    # 20 → 30 alongside the example-suite fix. With a 14-15m cold compile
    # already eating most of the old ceiling, the remaining test time left
    # almost no margin: measured locally, `--tests` spends ~8m40s actually
    # running, and three suites account for nearly all of it —
    # `unittests src/lib.rs` (255s), `html_rewriter_correctness` (145s) and
    # `plugins/main.rs` (118s). Those three are legitimately slow rather
    # than accidentally heavy: they encode real JPEGs and exercise a 5 MB
    # page in a debug profile. So the honest fix is headroom, not a faster
    # gate — a cancelled job reads as a test failure and is not one.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Every OS on stable, plus the MSRV floor and beta on Linux.
        #
        # REPO-STANDARD §6 asks for OS x toolchain. The full cross
        # product is nine jobs, and the two extra toolchains are
        # answering a question that is not OS-specific: "does this still
        # build on the floor we claim, and is it about to break on the
        # next compiler?" Both are compiler questions, so they run once
        # each on the cheapest and fastest runner rather than three
        # times. Platform-specific behaviour is what the OS row covers,
        # and this branch has found enough of it to know that row earns
        # its cost.
        #
        # The MSRV entry is the one that matters for users: it enforces
        # the `rust-version` floor in Cargo.toml, which the README now
        # states as a policy. beta is allowed to fail — it is an early
        # warning, not a gate.
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable]
        include:
          - os: ubuntu-latest
            toolchain: "1.88" # MSRV floor, must match Cargo.toml rust-version
          - os: ubuntu-latest
            toolchain: beta
            experimental: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: test-${{ matrix.os }}-${{ matrix.toolchain }}

      # NOTE: there is deliberately no separate `--lib` step. `--tests`
      # already builds and runs `unittests src/lib.rs` — the same binary,
      # verified with `cargo test --tests --no-run`, which lists
      # `Executable unittests src/lib.rs`. Running both meant the 3722
      # library unit tests executed twice, about four minutes wasted on
      # each of three platforms, in the job that was hitting its timeout.
      - name: Unit and integration tests
        shell: bash
        # `--tests` rather than an enumerated list of targets.
        #
        # The list this replaces named 13 of the 50 integration test files, so
        # 29 of them ran nowhere in CI — including `release_versions`, which
        # exists to catch a crate being published without a version gate, and
        # which was failing when it finally ran. A hardcoded target list is a
        # second inventory that has to be maintained in step with the first,
        # and it silently was not.
        #
        # `tests/ci_test_coverage.rs` now asserts that every test target is
        # reachable from a workflow, so this cannot drift back.
        run: cargo test --tests --features test-fault-injection

  # ── Phase 1b: documentation gates (REPO-STANDARD §2) ────────────────
  # These suites also run inside `cargo test --tests`, but they fail for a
  # different reason than a code test does — documentation drifted from
  # code — and a reader of a red pipeline should be able to see that from
  # the job name without opening the log. They are cheap, so the
  # duplication costs a minute and saves a misdiagnosis.
  docs-lint:
    name: docs lint
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: docs-lint
      # Cheap text checks. These are the same hooks
      # `.pre-commit-config.yaml` runs locally, so a contributor who
      # installed pre-commit sees them before pushing rather than after.
      - name: Spelling (typos)
        # Pinned to the release whose bundled dictionary matches what
        # `typos` installs locally (`cargo install typos-cli`). The
        # previous pin shipped 1.29.10, whose older dictionary flagged
        # "retuned" while a current local install did not — so this
        # passed locally and failed here, which is the exact
        # local/CI divergence DEVELOPMENT.md exists to prevent. When
        # bumping, bump the version in DEVELOPMENT.md too.
        uses: crate-ci/typos@d43b6c087ac471e2ea7b8af622ff15f05c0c365b # v1.50.1
      - name: Markdown lint
        # Globs and every rule exclusion live in
        # .markdownlint-cli2.jsonc, each with a stated reason.
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
      - name: docs/ files are not hidden by .gitignore
        run: ./scripts/check-docs-tracked.sh
      # An allow-list is a set of suppressions, and suppressions rot.
      - name: No dead entries in the typos allow-list
        run: |
          cargo install typos-cli --locked --version 1.50.1
          ./scripts/check-typos-allowlist.sh
      # REUSE checks that every file's licensing is machine-readable.
      # This repository carries SPDX headers rather than a .reuse/dep5,
      # so the lint proves the headers are actually complete rather than
      # merely present on the files someone remembered.
      - name: REUSE / SPDX compliance
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
      - name: Internal Markdown link integrity
        run: cargo test --test doc_links
      - name: README counts match the code
        run: cargo test --test readme_sync
      - name: Documented behaviour matches actual behaviour
        run: cargo test --test docs_accuracy
      - name: DEVELOPMENT.md matches the workflow
        run: cargo test --test development_docs
      - name: Man page matches the CLI definition
        run: cargo test --test man_page
      - name: Shell completions match the CLI definition
        run: cargo test --test completions
      # Builds the rendered user manual and checks the output rather
      # than the exit code: `mdbook build` exits 0 for a book with no
      # chapters, an empty search index, or a table of contents that
      # lost its sections.
      - name: User manual builds
        run: |
          cargo install mdbook --locked --version 0.5.4
          ./scripts/build-manual.sh
      - name: rustdoc builds with no broken intra-doc links
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps -p ssg

  # ── Phase 2b: end-to-end examples (Linux only — heavy I/O) ──────────
  examples:
    name: example outputs
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # This is the job that builds `examples/*/public`, so it is the job
      # where a gate finding nothing to scan is a real failure rather than a
      # missing prerequisite (#676). The example-dependent suites key on this
      # rather than on `CI`, which fired in every job including the per-OS
      # `test` job that never builds examples.
      SSG_REQUIRE_EXAMPLES: "1"
    permissions:
      contents: read
      security-events: write # upload-sarif (ssg's own audit SARIF, #562)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: examples
      - name: Build all examples
        run: cargo build --examples --quiet
      - name: Validator regression suite
        # `--test-threads=1` because examples bind 127.0.0.1:3000.
        run: cargo test --test example_outputs -- --test-threads=1
      - name: JSON Feed 1.1 compliance
        # Runs here, after the step above has built the blog example, so
        # it reuses that output instead of building it again. The suite
        # is gated on SSG_REQUIRE_EXAMPLES (set for this job) and skips
        # elsewhere: two test binaries both running
        # `cargo run --example blog` contend for cargo's build lock and
        # for port 3000, and their serialising mutexes are process-local
        # so neither sees the other.
        run: cargo test --test json_feed_compliance
      - name: JSON-LD schema validation
        # Walks every examples/*/public HTML produced above, extracts
        # all <script type="application/ld+json"> blocks, and validates
        # required fields per schema.org @type. Resolves #467.
        run: cargo test --test jsonld_validation
      - name: Universal HTML element-presence gate
        # Asserts every page in every example output satisfies the 10
        # universal invariants (lang, title, meta description, main,
        # h1, canonical, og:* chain, twitter:card, viewport, charset).
        # See docs/architecture/regression-contract.md §2.
        run: cargo test --test element_presence
      - name: End-to-end build performance budgets
        # Hard wall-clock gate for 10/100-page synthetic-corpus builds.
        # See docs/architecture/regression-contract.md §3.
        run: cargo test --test perf_budgets
      - name: Documentation accuracy gate
        # Verifies README claims match source-of-truth files (test
        # count, WCAG version, coverage floors, MSRV, version sync,
        # SBOM/CycloneDX version, SECURITY.md disclosure section).
        run: cargo test --test docs_accuracy
      - name: Internal Markdown link integrity gate
        # Walks every .md in README/CHANGELOG/SECURITY/docs/* and
        # asserts every relative link resolves to an existing file.
        run: cargo test --test doc_links

      - name: Emit SARIF audit report (#562)
        # Runs the 14-gate audit against the bundled examples/blog
        # output (produced by `Validator regression suite` above)
        # and emits SARIF v2.1.0. The codeql-action upload step
        # below pushes it to GitHub Code Scanning so findings appear
        # in the Security tab.
        run: |
          if [ -d examples/blog/public ]; then
            cargo run --quiet -- audit \
              --output examples/blog/public \
              --sarif > ssg-audit.sarif || true
          else
            echo '{"version":"2.1.0","runs":[]}' > ssg-audit.sarif
          fi
      - name: Upload SARIF to GitHub Code Scanning (#562)
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: ssg-audit.sarif
          category: ssg-audit

  # ── Phase 2c: coverage gate (Linux only — llvm-cov is heavy) ────────
  coverage:
    name: coverage gate
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: coverage
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Run coverage (lib only — example_outputs runs in `examples` job)
        run: |
          # Exclude documented untestable modules from coverage:
          # - src/core/deploy_adapter.rs ships 6 "not yet implemented" deploy
          #   adapters (#527 in v0.0.43); they're stubs by design until each
          #   target is fleshed out in a follow-up.
          # - src/main.rs is the binary entry point — exercised by
          #   running the binary, never by `cargo test`. The library code
          #   that main.rs delegates to (lib.rs::run + dispatch_invocation)
          #   is what the gate cares about.
          #
          # We run `--lib` (not `--tests`) so the example_outputs
          # integration suite — which invokes `ssg build` end-to-end with
          # its own multi-minute timeouts — runs in the separate
          # `examples` job and doesn't get instrumented here. Integration
          # tests in tests/*.rs that DO exercise lib paths still contribute
          # via the doctests embedded in lib.rs/src/**.
          IGNORE='src/core/deploy_adapter\.rs|src/main\.rs'
          cargo llvm-cov --lib --features test-fault-injection \
            --ignore-filename-regex "$IGNORE" \
            --no-report --quiet
          # Second pass with default features off.
          #
          # `#[cfg(not(feature = "templates"))]` code never compiles into
          # the pass above, so llvm-cov cannot observe it and every line
          # in it counts as uncovered on a diff. That made
          # `codecov/patch` structurally unpassable for any change to
          # those paths — the `TaxonomyRenderer` fallback renderer being
          # the case that surfaced it.
          #
          # `--no-report` accumulates profraw data, so the `report` calls
          # below merge both feature configurations into one figure.
          cargo llvm-cov --lib --no-default-features \
            --ignore-filename-regex "$IGNORE" \
            --no-report --quiet
          cargo llvm-cov report --summary-only \
            --ignore-filename-regex "$IGNORE"
          cargo llvm-cov report --lcov --output-path coverage.lcov \
            --ignore-filename-regex "$IGNORE"
      - name: Enforce coverage floor
        run: |
          set -euo pipefail
          IGNORE='src/core/deploy_adapter\.rs|src/main\.rs'
          summary=$(cargo llvm-cov report --json --summary-only \
            --ignore-filename-regex "$IGNORE")
          regions=$(echo "$summary" | python3 -c "import json,sys; print(json.load(sys.stdin)['data'][0]['totals']['regions']['percent'])")
          lines=$(echo   "$summary" | python3 -c "import json,sys; print(json.load(sys.stdin)['data'][0]['totals']['lines']['percent'])")
          fns=$(echo     "$summary" | python3 -c "import json,sys; print(json.load(sys.stdin)['data'][0]['totals']['functions']['percent'])")
          echo "regions=${regions}%  lines=${lines}%  functions=${fns}%"
          ok=1
          python3 -c "import sys; sys.exit(0 if float('$regions') >= float('$COVERAGE_REGIONS_FLOOR') else 1)" \
            || { echo "::error::regions ${regions}% < floor ${COVERAGE_REGIONS_FLOOR}%"; ok=0; }
          python3 -c "import sys; sys.exit(0 if float('$lines')   >= float('$COVERAGE_LINES_FLOOR')   else 1)" \
            || { echo "::error::lines ${lines}% < floor ${COVERAGE_LINES_FLOOR}%"; ok=0; }
          python3 -c "import sys; sys.exit(0 if float('$fns')     >= float('$COVERAGE_FUNCTIONS_FLOOR') else 1)" \
            || { echo "::error::functions ${fns}% < floor ${COVERAGE_FUNCTIONS_FLOOR}%"; ok=0; }
          [ "$ok" = "1" ]
      - name: Upload to Codecov
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.lcov
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ── Phase 2d: supply chain audit ────────────────────────────────────
  audit:
    name: cargo-deny
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: audit
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Run cargo-deny check
        run: cargo deny check

  # ── Phase 2d: install contract (REPO-STANDARD §3) ───────────────────
  # The standard's acceptance criterion is "`make DESTDIR=/tmp/stage
  # install` produces a correct tree on a clean runner", so this job runs
  # on a runner that has never built the project and checks the staged
  # tree against the contract exactly — a file that stops being installed
  # fails it just as loudly as one that appears unexpectedly.
  #
  # The job runs scripts/install-smoke.sh and nothing else, so a
  # contributor reproduces it locally with a single command. Every red
  # round on this branch came from a local invocation that differed from
  # the one CI ran.
  install-smoke:
    name: install contract
    needs: lint
    runs-on: ubuntu-latest
    # A release build of the full dependency tree on a cold cache is the
    # bulk of this job; 20m was too close to it.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: install-smoke
      # zsh, fish and mandoc are the checkers, not dependencies of ssg:
      # without them the script skips those steps and would report a pass
      # it did not earn.
      - name: Install shells and the roff linter
        # The hosted runner image configures third-party apt sources this
        # job never installs from — Google Chrome among them. When one
        # serves a bad index, `apt-get update` exits 100 and fails the job.
        # Dropping them first keeps their availability off the critical
        # path; see the same guard in release.yml.
        run: |
          set -euo pipefail
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update -qq \
            || echo "apt-get update reported an error; continuing"
          sudo apt-get install -y --no-install-recommends zsh fish mandoc
      - name: make DESTDIR=/tmp/stage install
        run: ./scripts/install-smoke.sh /tmp/stage

  # ── Phase 2e: supply-chain attestation (#561) ───────────────────────
  # cargo-vet complements cargo-deny (license + CVE) with per-crate
  # attestation: every transitive dep must be audited by us, vouched
  # by an imported trust set, or explicitly exempted. See
  # supply-chain/README.md for the exemption reduction policy.
  vet:
    name: cargo-vet
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: vet
      - name: Install cargo-vet
        run: cargo install cargo-vet --locked
      - name: Run cargo-vet
        # `--locked` matches our cargo-deny convention and refuses
        # unexpected lock-file drift on PRs.
        run: cargo vet --locked
      - name: Exemption ratchet (count may only go down)
        # The exemption count in supply-chain/config.toml is a ratchet:
        # it may only decrease, never increase. The baseline lives in
        # supply-chain/exemptions-baseline.txt and is updated in the
        # same PR that burns exemptions down (see supply-chain/README.md
        # "544 to Zero" trajectory). Adding a new dependency must go
        # through `cargo vet certify` or an imported trust set — a new
        # [[exemptions.*]] entry without a matching baseline reduction
        # elsewhere fails this gate.
        run: |
          baseline="$(tr -d '[:space:]' < supply-chain/exemptions-baseline.txt)"
          count="$(grep -c '^\[\[exemptions\.' supply-chain/config.toml)"
          echo "exemptions: ${count} (baseline: ${baseline})"
          if [ "${count}" -gt "${baseline}" ]; then
            echo "::error file=supply-chain/config.toml::Exemption count ${count} exceeds the ratchet baseline ${baseline}. Audit the new dependency (cargo vet certify) instead of exempting it, or justify the exemption and still burn one down elsewhere. The baseline only moves downward."
            exit 1
          fi
          if [ "${count}" -lt "${baseline}" ]; then
            echo "::notice file=supply-chain/exemptions-baseline.txt::Exemption count ${count} is below the baseline ${baseline} — ratchet it down: echo ${count} > supply-chain/exemptions-baseline.txt"
          fi

  # ── Phase 2f: API semver gate (v0.0.47 plan §3 item 2.6) ────────────
  # cargo-semver-checks diffs the public API of every published crate
  # against its latest crates.io release, so breaking changes become
  # visible pre-merge instead of post-publish (two of the last three
  # releases were breaking). ssg-rpc-macro is excluded — proc-macro
  # crates expose no rustdoc-diffable API surface.
  semver-checks:
    name: cargo-semver-checks
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: semver-checks
      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --locked
      - name: Check public API against crates.io baseline
        run: |
          cargo semver-checks \
            --package ssg \
            --package ssg-core \
            --package ssg-rpc \
            --package ssg-search
