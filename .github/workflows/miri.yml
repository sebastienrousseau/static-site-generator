# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# Miri — undefined-behaviour, data-race, and uninit-memory detector.
#
# Trigger model (v0.0.45 #583 revision):
#   - `schedule`: nightly Cron run on main, no churn from PR pushes.
#   - `workflow_dispatch`: manual trigger from the Actions UI.
#   - `pull_request`: opt-in via label `run-miri`. PRs that don't
#     carry the label do not pay the ~90-minute Miri tax.
#
# Why not on every push: the v0.0.45 coverage lift pushed the lib
# suite to ~2500 tests. Miri's interpreter is 50-100x slower than
# native, so the run is consistently > 90 minutes. Triggering on
# every push-to-feat caused every PR to spawn ~4 cancelled Miri
# runs (the concurrency group kills each previous run as the next
# push arrives). Decoupled triggers fix the noise without losing
# the signal — Miri still runs nightly and on demand.

name: Miri

on:
  schedule:
    # Nightly at 02:30 UTC.
    - cron: "30 2 * * *"
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

concurrency:
  group: miri-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # rust-toolchain.toml pins stable; override per-job for Miri which
  # requires nightly. RUSTUP_TOOLCHAIN beats the toml file.
  RUSTUP_TOOLCHAIN: nightly

jobs:
  miri:
    # Only run on PRs that explicitly carry the `run-miri` label;
    # skip the lib-test pass on routine PRs to avoid the 90-minute
    # tax. schedule / workflow_dispatch always run.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'run-miri'))
    name: cargo miri test --lib
    runs-on: ubuntu-latest
    # Miri's interpreter is ~50-100x slower than native test execution;
    # the v0.0.45 lift pushed the lib suite to ~2500 tests. 180-minute
    # cap leaves head-room for future test growth without re-tuning.
    timeout-minutes: 180
    # `continue-on-error` used to sit here as an advisory window for the
    # first 30 days after #560 landed, to be dropped "once the
    # `.miri-skip` allowlist stabilises and Miri is reliably green".
    # #560 shipped in the v0.0.45 cycle, so the window closed months
    # ago, and the last 60 runs contain 6 successes, 8 concurrency
    # cancellations and zero failures. Left in place it would have made
    # this job permanently advisory by accident — a UB detector that
    # cannot fail the build reports nothing.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install nightly + miri component
        uses: dtolnay/rust-toolchain@efcb852328a9f50117170cc43094fb6f09eaf1ae # nightly
        with:
          components: miri, rust-src

      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          shared-key: miri

      - name: cargo miri setup
        run: cargo miri setup

      - name: Run Miri on lib tests
        # Honour the skip-list in `.miri-skip`. Each entry is a test
        # path (e.g. `plugin::cache::persists_across_runs`); the script
        # transforms them into a `--skip` argument list.
        run: |
          set -euo pipefail
          skip_args=""
          if [ -f .miri-skip ]; then
            while IFS= read -r line; do
              # Strip comments + blank lines.
              entry="${line%%#*}"
              entry="${entry## }"
              entry="${entry%% }"
              [ -n "$entry" ] || continue
              skip_args="$skip_args --skip $entry"
            done < .miri-skip
          fi
          echo "Skip list: $skip_args"
          # Honour the module allow-list in `.miri-include`. Miri runs over
          # those modules only — see that file for why the whole suite is not
          # interpreted (zero unsafe crate-wide; the job is a dependency
          # canary, and a full run does not fit in the timeout).
          include_args=""
          if [ -f .miri-include ]; then
            while IFS= read -r line; do
              entry="${line%%#*}"
              entry="$(echo "$entry" | sed 's/^ *//; s/ *$//')"
              [ -n "$entry" ] || continue
              include_args="$include_args $entry"
            done < .miri-include
          fi
          if [ -z "$include_args" ]; then
            echo "::error::.miri-include is empty — refusing to run Miri over"\
                 " the whole suite; it will exceed the job timeout"
            exit 1
          fi
          echo "Include list:$include_args"
          # MIRIFLAGS:
          #   -Zmiri-disable-isolation: allow tests that read $CARGO_HOME etc.
          #   -Zmiri-permissive-provenance: ureq + smol both rely on
          #     int-to-ptr casts that strict provenance flags trip on;
          #     the operations are sound under permissive provenance.
          #   -Zmiri-tree-borrows: rayon worker threads reach crossbeam-epoch,
          #     which rebuilds a `&Local` from a pointer to an interior `Entry`
          #     of its intrusive list (crossbeam-epoch internal.rs:562,
          #     `&*local_ptr`). Stacked Borrows rejects that retag — a model
          #     Miri's own diagnostic calls "still experimental" — while Tree
          #     Borrows, the newer model, accepts it. Chosen over
          #     -Zmiri-disable-stacked-borrows deliberately: that would silence
          #     the report by switching the aliasing model off entirely, which
          #     is the one thing Miri is here to do. Tree Borrows still catches
          #     real aliasing UB.
          #   -Zmiri-ignore-leaks: rayon's global pool is process-lifetime by
          #     design and never joined, so Miri's "main thread terminated
          #     without waiting for all remaining threads" fires at exit. This
          #     flag is the documented way to permit that; it relaxes no
          #     memory-correctness check.
          export MIRIFLAGS="-Zmiri-disable-isolation -Zmiri-permissive-provenance -Zmiri-tree-borrows -Zmiri-ignore-leaks"
          cargo miri test --lib --features test-fault-injection -- $include_args $skip_args
