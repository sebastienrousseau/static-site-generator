# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# Scheduled & on-demand workloads. Runs:
#   - weekly  Monday 06:00 UTC (full surface check)
#   - manual  workflow_dispatch (anytime)
#
# Deliberately NOT triggered by `v*` tags. It used to be, described as
# "release-gating coverage", but nothing in `release.yml` waited on the
# result — so a tag push started two heavyweight runs side by side and
# gated nothing. That collision is what left v0.0.49 cancelled with no
# artefacts. Pre-release coverage is CI on `main` plus the release
# build matrix itself; run this manually against a tag if the full
# multi-OS surface is wanted before shipping.
#
# Holds the heavier checks that aren't worth the latency on every PR:
#   - Multi-OS × multi-toolchain build matrix (macOS, Windows, MSRV)
#   - Static musl release binary build
#   - WCAG 2.1 AA axe-core audit against generated example sites
#   - CycloneDX SBOM generation + provenance attestation

name: Scheduled

on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: scheduled-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  # ── Multi-OS × MSRV build matrix ────────────────────────────────────
  portability:
    name: ${{ matrix.os }} · ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable, "1.88"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: scheduled-${{ matrix.os }}-${{ matrix.toolchain }}
          save-if: ${{ github.event_name == 'schedule' }}
      - run: cargo build --all-targets --locked
      - run: cargo test --lib --locked
      - name: Doc build (deny warnings)
        env: { RUSTDOCFLAGS: -D warnings }
        run: cargo doc --no-deps -p ssg

  # ── Multi-OS example_outputs validators (resolves #473) ─────────────
  # Mirrors the `examples` job in ci.yml but on macOS + Windows runners.
  # Kept out of the per-PR `examples` job because the cargo build of every
  # example on a cold macOS/Windows runner is ~3× slower than Linux; running
  # weekly + on tag is the right cadence for catching platform regressions.
  examples-portability:
    name: example_outputs · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: examples-${{ matrix.os }}
          save-if: ${{ github.event_name == 'schedule' }}
      - name: Build all examples
        shell: bash
        run: cargo build --examples --quiet --locked
      - name: Validator regression suite
        # `--test-threads=1` because examples bind 127.0.0.1:3000.
        shell: bash
        run: cargo test --test example_outputs --locked -- --test-threads=1

  # ── Reproducible build verification (resolves #424) ─────────────────
  # Builds the release binary twice on the same SHA and asserts the SHA-256
  # hashes match. Path remapping via --remap-path-prefix removes the
  # absolute checkout path from the binary; SOURCE_DATE_EPOCH pins
  # build-time timestamps. A divergence here means a non-determinism
  # leaked in (timestamp, $HOME path, parallel codegen ordering, etc.).
  reproducible:
    name: reproducible build · linux
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_DATE_EPOCH: "1700000000"
      RUSTFLAGS: "--remap-path-prefix=${{ github.workspace }}=/build"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Pre-fetch all dependencies
        # Populates the local cargo cache so the second build can run
        # `--offline` without any network nondeterminism leaking in
        # (transient registry state, sparse-index timing, etc.).
        run: cargo fetch --locked
      - name: First build
        run: |
          cargo build --release --locked --offline -p ssg
          sha256sum target/release/ssg > /tmp/build1.sha256
          echo "Build 1: $(cat /tmp/build1.sha256)"
      - name: Clean target
        run: cargo clean -p ssg
      - name: Second build
        run: |
          cargo build --release --locked --offline -p ssg
          sha256sum target/release/ssg > /tmp/build2.sha256
          echo "Build 2: $(cat /tmp/build2.sha256)"
      - name: Compare hashes
        run: |
          set -euo pipefail
          h1=$(awk '{print $1}' /tmp/build1.sha256)
          h2=$(awk '{print $1}' /tmp/build2.sha256)
          if [ "$h1" = "$h2" ]; then
            echo "✓ Reproducible: ${h1}"
          else
            echo "::error::Non-reproducible build — hashes differ:"
            echo "  build1: ${h1}"
            echo "  build2: ${h2}"
            echo "Investigate via: diff <(strings target/release/ssg)"
            exit 1
          fi

  # ── Static musl release binary ──────────────────────────────────────
  musl:
    name: linux · musl static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl-tools
        # The hosted runner image configures third-party apt sources this
        # job never installs from — Google Chrome among them. When one
        # serves a bad index, `apt-get update` exits 100 and fails the job.
        # Dropping them first keeps their availability off the critical
        # path; see the same guard in release.yml.
        run: |
          set -euo pipefail
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update \
            || echo "apt-get update reported an error; continuing"
          sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: musl
      - run: cargo build --release --target x86_64-unknown-linux-musl --locked
      - name: Verify static linking
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/ssg
          file "$BIN"
          # `file` output includes "statically linked" or "static-pie linked"
          # for musl builds. `ldd` is unreliable on static-pie binaries.
          if file "$BIN" | grep -qE "static(ally|-pie) linked"; then
            echo "✓ Fully static"
          else
            echo "⚠ Not statically linked"
            exit 1
          fi

  # ── WCAG 2.1 AA audit (axe-core) ───────────────────────────────────
  a11y:
    name: WCAG 2.1 AA · axe-core
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: a11y
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # Was pa11y, pinned in tests/a11y. That pulled puppeteer ->
      # @puppeteer/browsers -> extract-zip, the source of five high-severity
      # Dependabot alerts, one with no patched release in existence. axe-core
      # runs on the @axe-core/playwright that tests/visual already used, so
      # the vulnerable subtree left the repo without adding a dependency.
      - name: Install audit tooling
        working-directory: tests/visual
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build SSG
        run: cargo build --locked

      - name: Generate example site
        run: |
          ./target/debug/ssg \
            -c examples/content/en \
            -o /tmp/a11y-site \
            -t examples/templates \
            -q

      - name: Serve and audit
        run: |
          set -euo pipefail
          python3 -m http.server 8787 --directory /tmp/a11y-site &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8787/ && break
            sleep 1
          done
          node tests/visual/audit-site.mjs \
            --base http://localhost:8787 \
            --dir /tmp/a11y-site

  # ── CycloneDX + SPDX SBOM (issue #533) ──────────────────────────────
  # Dual-format SBOM emission:
  #   - CycloneDX 1.5 JSON via cargo-cyclonedx — broad tooling support,
  #     OWASP-curated format, the existing artifact.
  #   - SPDX 2.3 JSON via cargo-sbom — the format US federal procurement
  #     (EO 14028, FedRAMP) and the EU CRA explicitly call out.
  # SPDX 3.0 JSON-LD is a 2024 spec; no production-grade Rust generator
  # has shipped support yet (cargo-sbom v0.10 tops out at 2.3, the
  # NTIA-recognised "minimum elements" baseline). When SPDX 3.0
  # tooling matures we drop in the new --output-format here.
  sbom:
    name: CycloneDX + SPDX SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: sbom
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache cargo-cyclonedx
        id: cache-cyclonedx
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-cyclonedx
          key: cargo-cyclonedx-0.5

      - if: steps.cache-cyclonedx.outputs.cache-hit != 'true'
        run: cargo install cargo-cyclonedx --locked

      - name: Cache cargo-sbom
        id: cache-sbom
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-sbom
          key: cargo-sbom-0.10

      - if: steps.cache-sbom.outputs.cache-hit != 'true'
        run: cargo install cargo-sbom --locked

      - name: Generate CycloneDX SBOM
        # v0.5+ removed --output-cdx; the tool now names files *_cdx.json
        # by default when using --format json.
        run: cargo cyclonedx --format json --spec-version 1.5

      - name: Generate SPDX SBOM
        # spdx_json_2_3 is the highest SPDX version cargo-sbom v0.10
        # supports. SPDX 3.0 is a JSON-LD redesign; tooling adoption
        # is tracked in https://github.com/spdx/spdx-3-model.
        run: cargo sbom --output-format spdx_json_2_3 > ssg.spdx.json

      - name: Validate SPDX JSON shape
        # Schema-level sanity check: every spec-required top-level field
        # is present. Full JSON-Schema validation runs in the
        # sbom_compliance integration test (tests/sbom_compliance.rs).
        run: |
          set -euo pipefail
          for key in spdxVersion dataLicense SPDXID documentNamespace creationInfo packages; do
            if ! jq -e "has(\"$key\")" ssg.spdx.json > /dev/null; then
              echo "::error::SPDX SBOM missing required key: $key"
              exit 1
            fi
          done
          echo "SPDX version: $(jq -r .spdxVersion ssg.spdx.json)"
          echo "Packages: $(jq '.packages | length' ssg.spdx.json)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: ./*.cdx.json
          if-no-files-found: warn
          retention-days: 90

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-spdx
          path: ./ssg.spdx.json
          if-no-files-found: warn
          retention-days: 90

      - name: Attest provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ./*.cdx.json
            ./ssg.spdx.json

  # ── Scalability benchmarks ─────────────────────────────────────────
  benchmark:
    name: scalability benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: bench
      - name: Run scalability benchmarks
        run: cargo bench --bench bench -- scalability
      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: target/criterion/
          retention-days: 90
