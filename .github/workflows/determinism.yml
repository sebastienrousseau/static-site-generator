# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# Deterministic cross-platform output gate (v0.0.47 plan §2 item 1.7).
#
# Builds `benches/corpus/small` (100 deterministic pages seeded by
# tools/seed-bench-corpus.sh) on ubuntu-latest AND macos-latest, hashes
# the emitted site tree, and fails if the two trees differ byte-for-byte.
# Also runs a same-runner double-build check: two `ssg build` runs from
# the same binary must emit identical trees (catches HashMap-iteration
# ordering, timestamps, and other run-to-run nondeterminism cheaply, at
# fixture scale — the full binary-reproducibility double build stays in
# scheduled.yml).
#
# SOURCE_DATE_EPOCH is pinned per the reproducible-build convention
# documented in SECURITY.md (same 1700000000 epoch as scheduled.yml's
# `reproducible` job).
#
# Hashing strategy: a sorted per-file SHA-256 manifest (relative paths,
# content-only) rather than `tar --sort=name --mtime=@0 --owner=0
# --group=0 | sha256sum`. GNU tar options don't exist in macOS BSD tar,
# and manifest hashing sidesteps NFC/NFD filename-normalization noise —
# the corpus paths are ASCII and the hash covers file *content* plus
# LC_ALL=C-sorted relative paths only. The manifest is uploaded next to
# the tree hash so a mismatch pinpoints the exact divergent file(s).

name: Determinism

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: determinism-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Reproducible-build epoch — see SECURITY.md §Reproducible builds.
  SOURCE_DATE_EPOCH: "1700000000"

jobs:
  # ── Build the fixture site and hash the output tree, per OS ────────
  build-hash:
    name: site hash · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: determinism-${{ matrix.os }}

      - name: Build ssg (release, locked)
        run: cargo build --release --locked -p ssg

      - name: Seed deterministic fixture corpus
        # 100 pages, byte-identical across machines/OSes by construction
        # (page bodies derive from SHA-256 of the page index).
        run: ./tools/seed-bench-corpus.sh small

      - name: Build the fixture site
        run: |
          ./target/release/ssg build \
            --content benches/corpus/small/content \
            --template benches/corpus/small/templates \
            --output benches/corpus/small/public

      - name: Hash the output tree
        run: |
          set -euo pipefail
          cd benches/corpus/small/public
          # Content-only manifest: "<sha256>  <sorted relative path>".
          # `shasum -a 256` exists on both ubuntu (perl) and macOS.
          #
          # TEMPORARY EXCLUSIONS (remove with the staticdatagen =0.0.11
          # pin, v0.0.47 plan Track U):
          #   - news-sitemap.xml: 0.0.10's generator stamps a
          #     wall-clock fallback for `item_pub_date` even when
          #     frontmatter carries a fixed ISO date. The staged 0.0.11
          #     parses the ISO form (spec A4) and removes the fallback.
          #   - .meta/**/*.json: 0.0.10 serialises each page's sidecar
          #     from an unordered map, so key order (not content)
          #     differs run-to-run. Tracked upstream; drop this filter
          #     once a staticdatagen release sorts the keys.
          #
          # PERMANENT EXCLUSION: .ssg-plugin-cache.json is ssg's own
          # incremental-rebuild cache (src/plugins/plugin.rs). It is
          # correctly *path-dependent* — keyed by this build's absolute
          # output path — so it legitimately differs whenever the two
          # trees being compared live at different absolute paths (as
          # both jobs in this workflow do). Key *order* within the file
          # is deterministic (BTreeMap); only the path-keyed content is
          # expected to vary, so it is out of scope for this gate.
          find . -type f \
            ! -name 'news-sitemap.xml' \
            ! -path './.meta/*' \
            ! -name '.ssg-plugin-cache.json' \
            -print0 | LC_ALL=C sort -z \
            | while IFS= read -r -d '' f; do
                printf '%s  %s\n' \
                  "$(shasum -a 256 "$f" | awk '{print $1}')" "$f"
              done > "$RUNNER_TEMP/manifest.txt"
          shasum -a 256 "$RUNNER_TEMP/manifest.txt" \
            | awk '{print $1}' > "$RUNNER_TEMP/tree.sha256"
          echo "tree hash (${{ matrix.os }}): $(cat "$RUNNER_TEMP/tree.sha256")"

      - name: Upload tree hash + manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: determinism-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/tree.sha256
            ${{ runner.temp }}/manifest.txt
          if-no-files-found: error
          retention-days: 7

  # ── Cross-OS comparison: ubuntu tree must equal macos tree ──────────
  cross-os-compare:
    name: cross-os hash compare
    needs: build-hash
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: hashes

      - name: Compare tree hashes
        run: |
          set -euo pipefail
          linux=$(cat hashes/determinism-ubuntu-latest/tree.sha256)
          macos=$(cat hashes/determinism-macos-latest/tree.sha256)
          echo "ubuntu-latest: ${linux}"
          echo "macos-latest:  ${macos}"
          if [ "$linux" = "$macos" ]; then
            echo "✓ Deterministic across OSes: ${linux}"
          else
            echo "::error::Site output differs between ubuntu-latest and macos-latest"
            echo "Divergent files (manifest diff):"
            diff -u hashes/determinism-ubuntu-latest/manifest.txt \
                    hashes/determinism-macos-latest/manifest.txt || true
            exit 1
          fi

  # ── Same-runner double build: two runs must emit identical trees ────
  double-build:
    name: double build · ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: determinism-ubuntu-latest

      - name: Build ssg (release, locked)
        run: cargo build --release --locked -p ssg

      - name: Seed deterministic fixture corpus
        run: ./tools/seed-bench-corpus.sh small

      - name: Build the fixture site twice
        run: |
          set -euo pipefail
          for run in 1 2; do
            out="$RUNNER_TEMP/out-${run}"
            rm -rf "$out"
            ./target/release/ssg build \
              --content benches/corpus/small/content \
              --template benches/corpus/small/templates \
              --output "$out"
          done

      - name: Compare the two output trees
        run: |
          set -euo pipefail
          hash_tree() {
            (
              cd "$1"
              # Same exclusions as the cross-OS job above:
              # news-sitemap.xml + .meta/**/*.json are a staticdatagen
              # 0.0.10 upstream nondeterminism (wall-clock fallback;
              # unordered sidecar map) tracked for the =0.0.11 pin.
              # .ssg-plugin-cache.json is ssg's own incremental cache,
              # permanently path-keyed to this build's absolute output
              # directory — expected to differ across $RUNNER_TEMP
              # subdirectories regardless of any content nondeterminism.
              find . -type f \
                ! -name 'news-sitemap.xml' \
                ! -path './.meta/*' \
                ! -name '.ssg-plugin-cache.json' \
                -print0 | LC_ALL=C sort -z \
                | while IFS= read -r -d '' f; do
                    printf '%s  %s\n' \
                      "$(shasum -a 256 "$f" | awk '{print $1}')" "$f"
                  done
            )
          }
          hash_tree "$RUNNER_TEMP/out-1" > "$RUNNER_TEMP/manifest-1.txt"
          hash_tree "$RUNNER_TEMP/out-2" > "$RUNNER_TEMP/manifest-2.txt"
          h1=$(shasum -a 256 "$RUNNER_TEMP/manifest-1.txt" | awk '{print $1}')
          h2=$(shasum -a 256 "$RUNNER_TEMP/manifest-2.txt" | awk '{print $1}')
          echo "build 1: ${h1}"
          echo "build 2: ${h2}"
          if [ "$h1" = "$h2" ]; then
            echo "✓ Double build deterministic: ${h1}"
          else
            echo "::error::Two builds of the same corpus emitted different trees"
            diff -u "$RUNNER_TEMP/manifest-1.txt" "$RUNNER_TEMP/manifest-2.txt" || true
            exit 1
          fi
