# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# OSSF Scorecard supply-chain posture scan (v0.0.47 plan §3 item 2.6).
#
# Runs the ossf/scorecard-action checks (pinned dependencies, branch
# protection, SAST, token permissions, …) weekly and on every push to
# main, publishes results for the public REST API / badge, and uploads
# the SARIF to GitHub Code Scanning so findings surface in the
# Security tab alongside the ssg-audit SARIF from ci.yml.

name: Scorecard

on:
  schedule:
    # Weekly, Monday 03:15 UTC.
    - cron: "15 3 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Needed to upload the SARIF to code-scanning.
      security-events: write
      # Needed by scorecard-action to publish signed results (OIDC).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          # Publish to the OSSF REST API so the README badge resolves.
          publish_results: true

      - name: Upload Scorecard SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: scorecard.sarif
          retention-days: 7

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: scorecard.sarif
