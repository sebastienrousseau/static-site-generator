# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# Nightly benchmark run — WS0.4 of the v0.0.58 elevation plan.
#
# The README quotes throughput and build-time figures. Until this workflow
# existed, those numbers were measured once, by hand, on an unnamed machine,
# and then quoted indefinitely: BENCHMARKS.md still described "SSG v0.0.45"
# while the crate was at v0.0.58. A number nobody re-measures is a claim, not
# a measurement.
#
# So the figures are produced here, on a named runner, from a seeded corpus
# (`ssg::bench_corpus`, byte-identical across runs and machines), and uploaded
# as an artifact that anyone can download and check.
#
# Trigger model mirrors miri.yml: nightly on schedule, on demand via dispatch,
# and opt-in per PR via the `run-benchmarks` label — Criterion sampling is far
# too slow to sit on every push.

name: Benchmarks

on:
  schedule:
    # Nightly at 03:30 UTC — after Miri (02:30) so the two never contend for
    # the same runner pool.
    - cron: "30 3 * * *"
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

# Least privilege at the top level. The one step that needs write --
# committing the nightly figures back to BENCHMARKS.md -- gets it on the
# job instead, so a pull_request run of this workflow cannot write to the
# repository at all. Flagged by Scorecard's Token-Permissions check as a
# top-level `contents: write`.
permissions:
  contents: read

jobs:
  # One job per Criterion target. Run as a single job, all 421 benchmarks at
  # Criterion's default sampling took longer than the 90-minute limit (the
  # 2026-10-01 nightly was cancelled at the limit). Splitting keeps full
  # sampling precision for the published figures instead of shortening it.
  bench:
    name: Criterion · ${{ matrix.target }}
    # Only run on a PR when explicitly labelled; always run on schedule and
    # manual dispatch.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-benchmarks')
    runs-on: ubuntu-24.04
    # The first split run (2026-10-01) took 76 min for all_pub_api and
    # 72 min for bench; 120 leaves room for a slower runner without
    # shortening Criterion's sampling.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target:
          - bench
          - bench_html_scanning
          - avif_vs_webp
          - incremental_1000_pages
          - all_pub_api
          - bench_concurrent_operations
          - core
          - plugins
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: benchmarks
      - name: Verify the corpus generator is deterministic
        # If the corpus is not reproducible the timings below mean nothing, so
        # this gates the run rather than merely reporting.
        run: cargo test --lib bench_corpus
      - name: Run benchmarks
        # `--bench <target>` selects one [[bench]] target. A bare
        # `cargo bench` also runs the library and binary under libtest's
        # bench harness, which rejects Criterion's `--output-format` with
        # "Unrecognized option" and failed every run before a single
        # Criterion benchmark started.
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -o pipefail
          cargo bench --features benchmark --bench "$TARGET" -- --output-format bencher \
            | tee "bench-raw-$TARGET.txt"
      - name: Upload this target's results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-raw-${{ matrix.target }}
          path: |
            bench-raw-${{ matrix.target }}.txt
            target/criterion/**
          retention-days: 90

  report:
    name: Benchmark report
    needs: bench
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Write is needed only by the "Commit the published figures" step,
    # which is itself guarded by `github.event_name == 'schedule'`.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The publish step commits back to the branch.
          persist-credentials: true
      - name: Download every target's results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bench-raw-*
          merge-multiple: true
      # The hardware is part of the result. A figure without the machine it
      # was measured on cannot be compared with anything.
      - name: Record the environment
        id: env
        run: |
          {
            echo "## Run environment"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Date (UTC) | $(date -u +'%Y-%m-%d %H:%M') |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Runner | ${RUNNER_OS} / ${RUNNER_ARCH} (${RUNNER_NAME}) |"
            echo "| CPU | $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs) |"
            echo "| Cores | $(nproc) |"
            echo "| Memory | $(free -h | awk '/^Mem:/{print $2}') |"
            echo "| Rust | $(rustc --version) |"
            echo "| SSG | $(grep -m1 '^version' Cargo.toml | cut -d'"' -f2) |"
          } > bench-env.md
          cat bench-env.md >> "$GITHUB_STEP_SUMMARY"

      # Keep only the bencher-format result lines. `cargo bench` writes
      # everything a bench prints to stdout, and on 2026-10-05 and 10-06 the
      # nightly run published 455 MB of it into BENCHMARKS.md: the step
      # summary upload aborted at its 1 MB cap and the commit was refused
      # by GitHub's 100 MB file limit, so the workflow has failed every
      # night since. One result line per benchmark is the whole document.
      - name: Combine the targets in a fixed order
        run: |
          set -euo pipefail
          : > bench-raw.txt
          # Criterion's bencher output is normally one line per benchmark,
          # `test <name> ... bench: <n> ns/iter (+/- <m>)`. When it cannot read
          # a previous baseline it interleaves an ERROR line, and the result
          # arrives split across two lines (seen on incremental_1000_pages in
          # run 37525482107). Re-join those so a result is never dropped.
          for t in bench bench_html_scanning avif_vs_webp incremental_1000_pages all_pub_api bench_concurrent_operations core plugins; do
            test -s "bench-raw-$t.txt" || { echo "::error::no results for $t"; exit 1; }
            lines=$(awk '
              /^test [^ ]+ \.\.\. bench: / { print; name=""; next }
              /^test [^ ]+ \.\.\. /        { name=$2; next }
              /^bench: / && name != ""   { print "test " name " ... " $0; name=""; next }
            ' "bench-raw-$t.txt")
            test -n "$lines" || { echo "::error::no bencher result lines for $t"; exit 1; }
            printf '%s\n' "$lines" >> bench-raw.txt
          done
          size=$(wc -c < bench-raw.txt)
          test "$size" -le 262144 || { echo "::error::combined results are ${size} bytes; expected one line per benchmark"; exit 1; }
      - name: Assemble the report
        run: |
          {
            cat bench-env.md
            echo
            echo "## Results"
            echo
            echo '```'
            cat bench-raw.txt
            echo '```'
          } > bench-report.md
          cat bench-report.md >> "$GITHUB_STEP_SUMMARY"

      # WS0.4: "Nightly workflow publishes BENCHMARKS.md from Criterion
      # output". Writing the numbers back into the document means the file a
      # reader opens is the last measured run rather than whatever was typed
      # in months ago — BENCHMARKS.md described v0.0.45 while the crate was at
      # v0.0.58 precisely because nothing wrote to it.
      #
      # Only the scheduled run publishes: a PR or a manual dispatch produces
      # the artifact for inspection without rewriting the document.
      - name: Publish results into BENCHMARKS.md
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, datetime
          doc = pathlib.Path("BENCHMARKS.md")
          text = doc.read_text(encoding="utf-8")
          start = text.index("<!-- BENCHMARK-RESULTS:START -->")
          end = text.index("<!-- BENCHMARK-RESULTS:END -->")

          env = pathlib.Path("bench-env.md").read_text(encoding="utf-8")
          raw = pathlib.Path("bench-raw.txt").read_text(encoding="utf-8")

          stamp = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          body = (
              "<!-- BENCHMARK-RESULTS:START -->\n"
              f"_Last measured {stamp}. Regenerated by the nightly workflow; "
              "do not edit by hand._\n\n"
              f"{env}\n"
              "```\n" + raw.strip() + "\n```\n"
          )
          doc.write_text(text[:start] + body + text[end:], encoding="utf-8")
          print("BENCHMARKS.md updated")
          PY

      - name: Commit the published figures
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          if git diff --quiet -- BENCHMARKS.md; then
            echo "no change to publish"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BENCHMARKS.md
          git commit -m "chore(bench): publish nightly figures [skip ci]"
          git push

      - name: Upload the report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmarks-${{ github.sha }}
          path: |
            bench-report.md
            bench-raw.txt
          retention-days: 90
