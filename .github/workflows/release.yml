# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# Release pipeline. Triggered by `git tag v<version> && git push --tags`.
#
# Output artifacts (all signed with SHA256, sigstore attestation, and
# detached GPG signature where the GPG_PRIVATE_KEY secret is set):
#
#   Linux glibc x86_64       ssg-vX.Y.Z-x86_64-unknown-linux-gnu.tar.gz
#                            ssg_X.Y.Z_amd64.deb
#                            ssg-X.Y.Z-1.x86_64.rpm
#   Linux musl x86_64        ssg-vX.Y.Z-x86_64-unknown-linux-musl.tar.gz
#   macOS Apple Silicon      ssg-vX.Y.Z-aarch64-apple-darwin.tar.gz
#                            ssg-X.Y.Z-aarch64.pkg
#   macOS Intel              ssg-vX.Y.Z-x86_64-apple-darwin.tar.gz
#                            ssg-X.Y.Z-x86_64.pkg
#   Windows MSVC x86_64      ssg-vX.Y.Z-x86_64-pc-windows-msvc.zip
#                            ssg-X.Y.Z-x86_64.msi
#   Container                ghcr.io/sebastienrousseau/static-site-generator:vX.Y.Z
#                            ghcr.io/sebastienrousseau/static-site-generator:latest
#   AUR                      static-site-generator-X.Y.Z (gated on AUR_SSH_KEY secret)
#   crates.io                ssg X.Y.Z
#
# Secrets used:
#   GITHUB_TOKEN              built-in        (release upload, GHCR push)
#   CARGO_REGISTRY_TOKEN      required         (crates.io publish)
#   GPG_PRIVATE_KEY           optional         (artifact signatures — skipped if absent)
#   GPG_PASSPHRASE            optional         (companion to GPG_PRIVATE_KEY)
#   AUR_SSH_KEY               optional         (AUR publish — skipped if absent)

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# A release must never be silently superseded. `cancel-in-progress:
# false` means a second tag push queues behind the first rather than
# killing a run that may already have published sub-crates to
# crates.io — a partially-published release is not re-runnable.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # ── Detect optional secrets so downstream jobs can gate on them ────
  # GitHub forbids `secrets.*` in job-level `if:`, so this job exposes
  # the existence of GPG / AUR secrets as boolean outputs.
  secrets-presence:
    name: detect optional secrets
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      has_gpg: ${{ steps.check.outputs.has_gpg }}
      has_aur: ${{ steps.check.outputs.has_aur }}
    steps:
      - id: check
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "has_gpg=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_gpg=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$AUR_SSH_KEY" ]; then
            echo "has_aur=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_aur=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Build + per-platform package (Linux .deb/.rpm, macOS .pkg, Windows .msi) ──
  build:
    name: build · ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds natively on both architectures rather than
          # cross-compiling. GitHub's arm64 runners make that possible,
          # and a native build avoids maintaining a cross linker
          # toolchain whose failures surface only at release time.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            pkg: deb_rpm
            deb_arch: amd64
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            musl: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
            pkg: deb_rpm
            deb_arch: arm64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            archive: tar.gz
            musl: true
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            pkg: macos
            arch: aarch64
          - target: x86_64-apple-darwin
            os: macos-15-intel
            archive: tar.gz
            pkg: macos
            arch: x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            pkg: msi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - if: matrix.musl
        name: Install musl-tools
        # The hosted x86_64 runner image configures third-party apt sources
        # this job has no use for — Google Chrome among them. When one serves
        # a bad index, `apt-get update` exits 100 and takes the release with
        # it, even though every Ubuntu index fetched cleanly. That is what
        # blocked v0.0.60 three runs in a row:
        #
        #   E: Failed to fetch https://dl.google.com/linux/chrome-stable/...
        #      Packages.gz  Hash Sum mismatch
        #
        # The aarch64 image carries no such source, so the same step passed
        # there and failed here for a reason belonging to neither.
        #
        # Drop the sources we never install from, then let a residual update
        # failure through. This weakens nothing: `apt-get install` below is
        # the real gate and still fails loudly if musl-tools is genuinely
        # unavailable. An unreachable mirror for a repo we do not use is not
        # a reason to fail a release.
        run: |
          set -euo pipefail
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update \
            || echo "apt-get update reported an error; continuing"
          sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: release-${{ matrix.target }}
          save-if: false

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # ── Generic archive ─────────────────────────────────────────
      - name: Archive (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          BIN=target/${{ matrix.target }}/release/ssg
          ARCHIVE=ssg-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz
          chmod +x "$BIN"
          tar czf "$ARCHIVE" -C "$(dirname "$BIN")" "$(basename "$BIN")"
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Archive (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $BIN = "target/${{ matrix.target }}/release/ssg.exe"
          $ARCHIVE = "ssg-${env:GITHUB_REF_NAME}-${{ matrix.target }}.zip"
          Compress-Archive -Path $BIN -DestinationPath $ARCHIVE
          $hash = (Get-FileHash $ARCHIVE -Algorithm SHA256).Hash.ToLower()
          "$hash  $ARCHIVE" | Out-File -Encoding ascii "$ARCHIVE.sha256"

      # ── Linux: .deb + .rpm ──────────────────────────────────────
      - name: Build .deb
        if: matrix.pkg == 'deb_rpm'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp "target/${{ matrix.target }}/release/ssg" target/release/ssg
          sh packaging/deb/build.sh "$VERSION" "${{ matrix.deb_arch }}"
          DEB="ssg_${VERSION}_${{ matrix.deb_arch }}.deb"
          shasum -a 256 "$DEB" > "$DEB.sha256"

      - name: Install cargo-generate-rpm
        if: matrix.pkg == 'deb_rpm'
        run: cargo install cargo-generate-rpm --locked

      - name: Build .rpm
        if: matrix.pkg == 'deb_rpm'
        run: |
          cargo generate-rpm --target ${{ matrix.target }}
          mv "target/${{ matrix.target }}/generate-rpm/"*.rpm . || true
          for rpm in *.rpm; do
            [ -f "$rpm" ] && shasum -a 256 "$rpm" > "$rpm.sha256"
          done

      # ── macOS: .pkg ─────────────────────────────────────────────
      - name: Build .pkg (macOS)
        if: matrix.pkg == 'macos'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p root/usr/local/bin
          cp target/${{ matrix.target }}/release/ssg root/usr/local/bin/
          chmod +x root/usr/local/bin/ssg
          PKG="ssg-${VERSION}-${{ matrix.arch }}.pkg"
          pkgbuild --root root \
            --identifier com.sebastienrousseau.ssg \
            --version "${VERSION}" \
            --install-location / \
            "$PKG"
          shasum -a 256 "$PKG" > "$PKG.sha256"

      # ── Windows: .msi ───────────────────────────────────────────
      - name: Install cargo-wix
        if: matrix.pkg == 'msi'
        run: cargo install cargo-wix --locked

      - name: Build .msi (Windows)
        if: matrix.pkg == 'msi'
        shell: pwsh
        run: |
          # cargo-wix expects a wix/main.wxs template; if absent, generate one.
          if (-not (Test-Path "wix/main.wxs")) { cargo wix init --force -p ssg }
          cargo wix -p ssg --no-build --target ${{ matrix.target }} --output ssg-${env:GITHUB_REF_NAME}-x86_64.msi
          $msi = "ssg-${env:GITHUB_REF_NAME}-x86_64.msi"
          $hash = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLower()
          "$hash  $msi" | Out-File -Encoding ascii "$msi.sha256"

      # ── Upload everything this matrix entry produced ────────────
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ssg-${{ matrix.target }}
          path: |
            ssg-*.tar.gz
            ssg-*.tar.gz.sha256
            ssg-*.zip
            ssg-*.zip.sha256
            ssg_*.deb
            ssg_*.deb.sha256
            ssg-*.rpm
            ssg-*.rpm.sha256
            ssg-*.pkg
            ssg-*.pkg.sha256
            ssg-*.msi
            ssg-*.msi.sha256
          if-no-files-found: ignore
          retention-days: 7

  # ── GHCR container image (multi-arch: amd64 + arm64) ────────────
  ghcr:
    name: ghcr · linux/amd64,linux/arm64
    needs: build
    # QEMU-emulated arm64 compilation of the full Rust workspace is
    # slow; the generous timeout keeps the multi-arch image best-effort
    # (the `publish` job deliberately does not depend on this one).
    timeout-minutes: 180
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          # arm64 built under QEMU emulation via setup-qemu-action
          # (v0.0.47 plan §3 item 2.6).
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/sebastienrousseau/static-site-generator:${{ github.ref_name }}
            ghcr.io/sebastienrousseau/static-site-generator:latest
          # Cache lives in GHCR, not the GitHub Actions Cache service.
          # `type=gha` is what failed the v0.0.48 release: the image
          # itself built for 126.9s and then the run died with
          # `ERROR: not_found` while "exporting to GitHub Actions
          # Cache", so a green build produced no container image.
          #
          # `ignore-error=true` is the belt to that braces. A cache
          # export is an optimisation; it must never be able to fail a
          # release. With it set, a registry hiccup costs the next run
          # some time instead of costing this run the image.
          cache-from: type=registry,ref=ghcr.io/sebastienrousseau/static-site-generator:buildcache
          cache-to: type=registry,ref=ghcr.io/sebastienrousseau/static-site-generator:buildcache,mode=max,ignore-error=true

  # ── GPG sign all release artifacts ──────────────────────────────
  gpg-sign:
    name: gpg sign · all artifacts
    needs: [build, secrets-presence]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ needs.secrets-presence.outputs.has_gpg == 'true' }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Sign every release artifact
        run: |
          set -euo pipefail
          for f in artifacts/*.tar.gz artifacts/*.zip artifacts/*.deb \
                   artifacts/*.rpm artifacts/*.pkg artifacts/*.msi; do
            [ -f "$f" ] || continue
            gpg --batch --yes --armor --detach-sign "$f"
          done
          ls -la artifacts/*.asc

      - name: Upload signatures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gpg-signatures
          path: artifacts/*.asc
          retention-days: 7

  # ── AUR publish (gated on AUR_SSH_KEY secret) ───────────────────
  aur:
    name: aur · publish
    needs: [build, secrets-presence]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ needs.secrets-presence.outputs.has_aur == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure SSH for AUR
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_KEY }}" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
      - name: Update PKGBUILD pkgver and push
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # The Arch package name (`ssg`, set in PKGBUILD) governs the AUR
          # repository URL — not the GitHub repo name. Repo: aur/ssg.git.
          git clone ssh://aur@aur.archlinux.org/ssg.git aur-repo \
            -c core.sshCommand="ssh -i ~/.ssh/aur"
          cp packaging/arch/PKGBUILD aur-repo/PKGBUILD
          cd aur-repo
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          # Generate .SRCINFO via Arch container so we don't need makepkg locally
          docker run --rm -v "$(pwd):/pkg" archlinux:latest \
            bash -c 'cd /pkg && pacman -Sy --noconfirm base-devel && \
                     useradd -m b && chown -R b /pkg && \
                     su b -c "makepkg --printsrcinfo > .SRCINFO"'
          git config user.email "release-bot@example.com"
          git config user.name  "Release Bot"
          git add PKGBUILD .SRCINFO
          git commit -m "Release ${VERSION}"
          git push -c core.sshCommand="ssh -i ~/.ssh/aur"

  # ── Aggregate artefacts + SHA-256 subjects (feeds SLSA generator) ───
  # Issue #533: produce the base64-encoded subjects digest list that
  # the slsa-github-generator reusable workflow consumes to mint a
  # SLSA v1.1 Level 3 in-toto attestation per release artefact.
  subjects:
    name: aggregate subjects · sha256
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - id: hash
        name: Compute SHA-256 subjects payload
        run: |
          set -euo pipefail
          cd artifacts
          # The SLSA generator expects a base64-encoded multi-line
          # "<hex>  <filename>" digest list (the sha256sum -t format).
          # Only ship subjects for primary release artefacts — checksum
          # sidecars and detached signatures are not first-class subjects.
          shopt -s nullglob
          set +e
          payload=$(sha256sum \
            ./*.tar.gz ./*.zip ./*.deb ./*.rpm ./*.pkg ./*.msi 2>/dev/null \
            | sed 's| \./|  |')
          set -e
          if [ -z "$payload" ]; then
            echo "::error::No release artefacts found to attest"
            exit 1
          fi
          echo "$payload"
          encoded=$(printf '%s' "$payload" | base64 -w0)
          echo "hashes=$encoded" >> "$GITHUB_OUTPUT"

  # ── SLSA v1.1 Level 3 build provenance (issue #533) ─────────────────
  # Reusable workflow is pinned to the tag (NOT a SHA) — this is a
  # documented invariant of slsa-github-generator: the generator
  # validates github.workflow_ref against its release tag to mint a
  # non-falsifiable buildType. SHA-pinning a reusable SLSA workflow
  # would cause the generator to refuse to emit a Level 3 attestation.
  # See: https://github.com/slsa-framework/slsa-github-generator/blob/main/internal/builders/generic/README.md
  slsa-provenance:
    name: slsa v1.1 provenance
    needs: [subjects]
    permissions:
      id-token: write
      contents: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.subjects.outputs.hashes }}
      provenance-name: ssg-${{ github.ref_name }}.intoto.jsonl
      upload-assets: true

  # ── Re-verify provenance post-release (catches silent breakage) ─────
  # AC: any release artefact + its sibling .intoto.jsonl must pass
  # `slsa-verifier verify-artifact`. If this job ever fails on green
  # release, the published attestation is unusable and the release
  # must be re-cut. Pinned to a SHA (this is a plain action, not a
  # reusable workflow, so SHA-pinning is the correct security posture).
  verify-provenance:
    name: verify slsa attestation
    needs: [slsa-provenance, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1

      - name: Download release artefacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir verify && cd verify
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.tar.gz' \
            --pattern '*.zip' \
            --pattern '*.deb' \
            --pattern '*.rpm' \
            --pattern '*.pkg' \
            --pattern '*.msi' \
            --pattern '*.intoto.jsonl'
          ls -la

      - name: Verify every artefact against its provenance
        run: |
          set -euo pipefail
          cd verify
          shopt -s nullglob
          prov=$(find . -maxdepth 1 -name 'ssg-*.intoto.jsonl' -print -quit)
          if [ -z "$prov" ]; then
            echo "::error::No .intoto.jsonl provenance file found in release"
            exit 1
          fi
          failed=0
          for f in ./*.tar.gz ./*.zip ./*.deb ./*.rpm ./*.pkg ./*.msi; do
            [ -f "$f" ] || continue
            echo "::group::verify $f"
            if slsa-verifier verify-artifact "$f" \
                 --provenance-path "$prov" \
                 --source-uri "github.com/$GITHUB_REPOSITORY" \
                 --source-tag "$GITHUB_REF_NAME"; then
              echo "ok: $f"
            else
              echo "::error::SLSA verification failed for $f"
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          done
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed artefact(s) failed SLSA verification"
            exit 1
          fi

  # ── GitHub Release + crates.io publish ──────────────────────────
  publish:
    name: github release · crates.io
    # `gpg-sign` is here so its detached signatures exist BEFORE this job
    # downloads artifacts. Without it the two ran concurrently: this job
    # takes every artifact present at that instant, so the `.asc` files
    # usually lost the race and never reached the release — while
    # SECURITY.md and the generated release notes both told users to run
    # `gpg --verify`. Configuring the GPG secrets alone would not have
    # fixed that.
    #
    # `gpg-sign` is itself conditional on the GPG secret existing, and a
    # skipped dependency skips its dependents by default — which would
    # mean no secret, no release at all. Hence the explicit result check
    # below: proceed when it succeeded OR was skipped, fail only when it
    # actually failed.
    needs: [build, gpg-sign]
    if: >-
      !cancelled() &&
      needs.build.result == 'success' &&
      (needs.gpg-sign.result == 'success' || needs.gpg-sign.result == 'skipped')
    # GHCR is best-effort (multi-arch builds can be flaky); don't gate
    # the GitHub Release or crates.io publish on it.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # gh release create/edit + upload assets
      id-token: write # attest-build-provenance
      attestations: write # attest-build-provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/release-body.md << 'BODY'
          ## Install

          **Homebrew (macOS / Linux):**
          ```sh
          brew install --formula https://raw.githubusercontent.com/sebastienrousseau/static-site-generator/main/packaging/homebrew/ssg.rb
          ```

          **One-liner (macOS / Linux):**
          ```sh
          curl -fsSL https://raw.githubusercontent.com/sebastienrousseau/static-site-generator/main/scripts/install.sh | sh
          ```

          **Cargo (any platform with Rust):**
          ```sh
          cargo install ssg
          ```

          **Debian / Ubuntu:**
          ```sh
          sudo apt install ./ssg_*_amd64.deb
          ```

          **Fedora / RHEL:**
          ```sh
          sudo rpm -i ssg-*.rpm
          ```

          **macOS (.pkg installer):**
          ```sh
          sudo installer -pkg ssg-*.pkg -target /
          ```

          **Windows (MSI):** download `ssg-*.msi`, double-click to install.

          **Arch Linux (AUR):**
          ```sh
          yay -S static-site-generator
          ```

          **Container (GHCR):**
          ```sh
          docker pull ghcr.io/sebastienrousseau/static-site-generator:latest
          ```

          ---

          ## Verify

          Each archive ships a `.sha256` checksum. Where the maintainer has
          published a GPG key, a `.asc` detached signature is also provided.

          ```sh
          shasum -a 256 -c ssg-*.tar.gz.sha256
          gpg --verify ssg-*.tar.gz.asc ssg-*.tar.gz   # if .asc present
          ```

          **SLSA v1.1 provenance (Level 3, Sigstore-signed):**

          ```sh
          # Install once: https://github.com/slsa-framework/slsa-verifier
          slsa-verifier verify-artifact ssg-*.tar.gz \
            --provenance-path ssg-*.intoto.jsonl \
            --source-uri github.com/sebastienrousseau/static-site-generator \
            --source-tag ${{ github.ref_name }}
          ```

          See [docs/security/sbom-provenance.md](https://github.com/sebastienrousseau/static-site-generator/blob/main/docs/security/sbom-provenance.md)
          for the full SBOM (CycloneDX + SPDX) and SLSA verification guide.

          ---

          BODY

          # Idempotent: create the release if it doesn't exist, else
          # edit-in-place and upload artifacts with --clobber. This
          # makes the job safe to re-run after a partial failure
          # (e.g. crates.io token rotation between attempts) without
          # the "release already exists" abort.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — updating in place"
            gh release edit "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file /tmp/release-body.md
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file /tmp/release-body.md \
              --generate-notes \
              artifacts/*
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.pkg
            artifacts/*.msi

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      # Trusted publishing: swaps this job's OIDC identity for a
      # temporary crates.io token, revoked when the job ends. The
      # config is per crate, so all six ssg crates need their own
      # trusted publisher pointing at this repo and release.yml.
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish workspace to crates.io (dep order)
        # `cargo publish -p ssg` fails if ssg-core / ssg-rpc-macro /
        # ssg-rpc / ssg-search / ssg-a11y at the matching version don't
        # already exist on crates.io (path deps are verified against
        # the registry). Publish them first, in dependency order:
        #
        #   ssg-core         (no internal deps)
        #   ssg-rpc-macro    (no internal deps)
        #   ssg-rpc          (depends on ssg-rpc-macro)
        #   ssg-search       (no internal deps)
        #   ssg-a11y         (no internal deps)
        #   ssg-mcp          (depends on ssg-rpc, so it follows it)
        #   ssg             (depends on all of the above)
        #
        # ssg-wasm is deliberately excluded: it carries `publish = false`
        # in its own Cargo.toml and is not a dependency of `ssg`.
        #
        # Every publishable crate must therefore carry the SAME version
        # as the tag. When they drift — sub-crates sat at 0.0.47 while
        # the root moved to 0.0.48 — the first `cargo publish` hits
        # "already exists on crates.io index" and the release stops.
        # `tests/release_versions.rs` fails the build long before the
        # tag if that drift reappears.
        #
        # Idempotent retry: if a version is already on crates.io
        # (e.g. a previous release run already published the sub-crate
        # and the workflow is being re-run), don't fail the build.
        #
        # The "already published" case is detected by reading cargo's
        # own diagnostic, not by probing the crates.io HTTP API. The
        # previous implementation curl'd
        # `https://crates.io/api/v1/crates/$c/$ver` and treated any
        # non-200 as "not published"; that request failed from the
        # runner during the v0.0.48 release (it returns 200 from a
        # developer machine), so the guard reported a crate that WAS on
        # crates.io as missing, exited 1, and skipped the `ssg` publish
        # below. Parsing stderr needs no network and cannot produce a
        # false negative from a transient registry or CDN fault.
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail

          # Publish one crate. Returns 0 if it is on crates.io at the
          # expected version afterwards — whether this run put it
          # there or a previous one did.
          publish() {
            local crate="$1" manifest="$2" ver log rc=0
            # Sub-crates pass --no-verify: they were already built and
            # tested in earlier CI phases, and the rebuild costs
            # minutes each. The root crate verifies, because that is
            # the packaged artefact users actually consume.
            shift 2
            ver=$(grep -m1 '^version = ' "$manifest" | cut -d'"' -f2)
            log=$(mktemp)
            echo "::group::cargo publish -p $crate ($ver)"
            cargo publish -p "$crate" --locked "$@" 2>&1 | tee "$log" || rc=$?
            echo "::endgroup::"
            if [ "$rc" -eq 0 ]; then
              echo "✓ $crate $ver published"
              # crates.io's index needs a moment before the next crate
              # can resolve a dependency on this one.
              sleep 30
              return 0
            fi
            if grep -qE 'already (exists on crates\.io index|uploaded)' "$log"; then
              echo "✓ $crate $ver already on crates.io — continuing"
              return 0
            fi
            echo "::error::cargo publish -p $crate $ver failed (exit $rc) — see the group above"
            return 1
          }

          for c in ssg-core ssg-rpc-macro ssg-rpc ssg-search ssg-a11y ssg-mcp; do
            publish "$c" "crates/$c/Cargo.toml" --no-verify
          done

          # Same idempotency contract for the root crate, so a re-run
          # after a partial release is a no-op rather than a failure.
          publish ssg Cargo.toml
