# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# Ignore list for the OSV-Scanner-based checks OpenSSF Scorecard runs
# (`.github/workflows/scorecard.yml`, "Vulnerabilities" check).
#
# This file is a *superset* of `deny.toml`'s `[advisories].ignore`, not a
# mirror of it. The header used to claim "exactly", and the two had
# drifted apart unnoticed: this file carried five IDs deny.toml did not,
# while deny.toml carried one this file lacked. Nothing checked, so
# nothing noticed.
#
# Superset rather than mirror, because the two tools resolve different
# graphs. cargo-deny walks the feature-resolved dependency tree; OSV
# scans the lockfiles, which list optional dependencies whether or not
# any feature enables them. RUSTSEC-2025-0119 below is that case: its
# crate is in Cargo.lock, but no feature set of this workspace builds
# it (`cargo tree -i number_prefix --all-features --target all`).
#
# `tests/advisory_sync.rs` enforces the direction that matters: every
# advisory deny.toml ignores must appear here. The other direction is
# kept by hand: an entry stays only while its crate is in Cargo.lock or
# fuzz/Cargo.lock. Six were dropped in v0.0.68 because nothing matched
# them any more (yaml-rust, fxhash, the quick-xml <0.41 pair,
# proc-macro-error2, rkyv 0.7).
#
# All entries below are "unmaintained crate" informational advisories
# in transitive dependencies that cannot be resolved without upstream
# releases. See `deny.toml` for the per-crate reasoning.

[[IgnoredVulns]]
id = "RUSTSEC-2024-0436" # paste (unmaintained) — via rav1e (ravif AVIF encoding)
reason = "unmaintained transitive dep, no upstream fix available"

[[IgnoredVulns]]
id = "RUSTSEC-2025-0119" # number_prefix (unmaintained) — via indicatif
reason = "unmaintained transitive dep, no upstream fix available"

[[IgnoredVulns]]
id = "RUSTSEC-2025-0141" # bincode (unmaintained) — via syntect
reason = "unmaintained transitive dep, no upstream fix available"
