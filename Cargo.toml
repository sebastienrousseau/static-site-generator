# -----------------------------------------------------------------------------
# SSG - A lightning-fast static site generator (SSG) optimised for search engine visibility (SEO) and compliant with WCAG 2.1 Level AA accessibility standards.
# -----------------------------------------------------------------------------

[package]
# General project metadata
name = "ssg"                            # The name of the library
version = "0.0.59"                      # The version of the library
authors = ["SSG Contributors"]     # The authors of the library
edition = "2021"                        # The edition of the library
rust-version = "1.88.0"                 # Minimum supported Rust version (set by time-macros, staticdatagen, oxc_*)
license = "MIT OR Apache-2.0"           # Dual licensing strategy
description = """
A secure-by-default static site generator built in Rust. WCAG 2.2 AA validation, CSP/SRI hardening, native JS/CSS minification, automated CycloneDX SBOM, local LLM content pipeline, WebAssembly target, interactive islands, streaming compilation for 100K+ pages, 28-locale i18n, and one-command deployment.
"""
homepage = "https://github.com/sebastienrousseau/static-site-generator" # The project's homepage
documentation = "https://docs.rs/ssg" # Doc URL
repository = "https://github.com/sebastienrousseau/static-site-generator"
readme = "README.md"                    # The README file
build = "build.rs"                      # The build script

# -----------------------------------------------------------------------------
# Crate Configuration
# -----------------------------------------------------------------------------

# Crates.io categories
categories = [
    "command-line-utilities",
    "parsing",
    "template-engine",
    "web-programming",
]

# Keywords for easier discoverability on Crates.io
# (max 5 keywords; chosen for SEO across crates.io search and lib.rs).
keywords = ["rust", "markdown", "jamstack", "ssg", "wasm"]

# Note: `exclude` was removed in v0.0.41 prep. Cargo warns when both
# `include` and `exclude` are set ("the exclude list will be ignored"),
# and the slimmer `include` below is exhaustive — `.git/`, `.github/`,
# `.gitignore`, and `.vscode/` are naturally excluded because they're
# not listed in `include`.

# Including necessary files in the package
# Crates.io package contents — kept tight so downstream consumers don't
# pay for example sites, test fixtures, bench files, or node_modules in
# their `cargo build`. The 44.9MB v0.0.40 publish (which 408'd on the
# upload step) was bloated by /examples/**, /tests/**, and /benches/**;
# none of those are loaded at compile time by anything in /src/ (the
# sole `include_str!()` is /README.md, kept below).
include = [
    "/src/**",
    "/build.rs",
    "/Cargo.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
]


# -----------------------------------------------------------------------------
# docs.rs Configuration
# -----------------------------------------------------------------------------
# Starting May 2026, docs.rs builds only the default target unless
# explicitly configured. List all targets for cross-platform docs.
# See: https://blog.rust-lang.org/2026/04/04/docsrs-only-default-targets/
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

# -----------------------------------------------------------------------------
# Library Information
# -----------------------------------------------------------------------------

# The library file that contains the main logic for the binary.
[lib]
name = "ssg"                            # Internal name of the library
path = "src/lib.rs"                     # Path to the library entry point

# The main file that contains the entry point for the binary.
[[bin]]
name = "ssg"                            # Name of the binary
path = "src/main.rs"                    # Path to the binary entry point

# -----------------------------------------------------------------------------
# Features
# -----------------------------------------------------------------------------
[features]
# Optional features that can be enabled or disabled.
default = ["templates", "image-optimization"]
cli = []                                # Enable command-line interface support
benchmark = ["tempfile"]                 # Enable benchmark-specific functionality
templates = ["minijinja"]               # MiniJinja templating engine with inheritance, loops, conditionals
image-optimization = ["image", "ravif", "rgb"] # Image optimization with WebP + AVIF output and responsive srcset
test-fault-injection = ["fail/failpoints"]   # Test-only fault injection for fs error paths
# Marker feature for the AI / local-LLM content pipeline (`LlmPlugin`).
# The plugin module is unconditional so existing API consumers keep
# compiling, but enabling `ai` is required by the integration tests
# under `tests/llm_no_shellout.rs` and signals intent to exercise the
# HTTP roundtrip. No additional optional deps are pulled in — `ureq`
# is an unconditional dep because the plugin module is too.
ai = []

# Native HTML / JS / CSS minification (issue #519).
# Off by default — opting in pulls `minify-html`, `oxc_minifier`,
# `oxc_parser`, `oxc_codegen`, `oxc_allocator`, `oxc_span`, and
# `lightningcss` into the build. When disabled, `MinifyPlugin` falls
# back to a whitespace-collapsing pass that short-circuits on `<pre>`.
minify = [
    "dep:minify-html",
    "dep:oxc_minifier",
    "dep:oxc_parser",
    "dep:oxc_codegen",
    "dep:oxc_allocator",
    "dep:oxc_span",
    "dep:lightningcss",
    "dep:walkdir",
]

# OpenTelemetry build-pipeline tracing (issue #422). Off by default —
# enabling pulls `tracing` + `tracing-subscriber` for stdout JSON
# export. The OTLP/gRPC + Jaeger exporters are an additive layer
# tracked separately; introducing them now would pull `tokio` into
# the dependency graph, which the project otherwise avoids.
otel = ["dep:tracing", "dep:tracing-subscriber"]

# -----------------------------------------------------------------------------
# Build Dependencies
# -----------------------------------------------------------------------------
[build-dependencies]
# Dependencies for the build script, used for pre-compilation tasks.
version_check = "0.9.5"                   # Ensures that a compatible Rust version is used

# -----------------------------------------------------------------------------
# Development Dependencies
# -----------------------------------------------------------------------------
[dev-dependencies]
# Dependencies required for testing and development.
criterion = "0.8.2"                       # Benchmarking library to test performance
serial_test = "4.0"                        # Serialise fail-rs failpoint tests so they don't race
uuid = { version = "1.23.1", features = ["v4"] }
fail = { version = "0.5", features = ["failpoints"] }  # Fault injection for tests/fault_injection.rs
tempfile = "3.27.0"
proptest = "1"
# Used by `examples/rpc_example.rs` to derive JsonSchema on the input
# / output types of an `#[ssg_rpc]` function. Pinned to the same 1.2
# series as ssg-rpc to avoid duplicate copies in the lockfile.
schemars = { version = "1.2", features = ["derive"] }
# Edge-contract test (#546) drives the WASM render pipeline natively
# so we can assert AC4/AC5/AC6/AC7 without spinning up wrangler.
ssg-wasm = { path = "crates/ssg-wasm" }
# Captures `tracing` events emitted inside test bodies so the
# `llm_no_shellout` integration test (issue #520) can assert no
# subprocess-spawn span ever fires after the curl shellout was
# ported to `ureq`.
tracing = "0.1"
tracing-test = "0.2"

# -----------------------------------------------------------------------------
# Dependencies
# -----------------------------------------------------------------------------
[dependencies]
# Required dependencies for building and running the project.
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive", "cargo", "env"] }
http-handle = "0.0.7"
log = { version = "0.4.29", features = ["std"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# adr: ADR-0002 — Rayon is the build-pipeline CPU scheduler.
# See docs/adr/0002-rayon-orchestration.md.
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
ssg-a11y = { path = "crates/ssg-a11y", version = "0.0.59" }
ssg-core = { path = "crates/ssg-core", version = "0.0.59" }
ssg-rpc = { path = "crates/ssg-rpc", version = "0.0.59" }
ssg-search = { path = "crates/ssg-search", version = "0.0.59" }
thiserror = "2"
staticdatagen = "0.0.18"
toml = "1.1.2"

# Real cryptographic hashing for Subresource Integrity (issue #468 follow-up).
# Replaces the previous FNV-1a placeholder that emitted invalid `sha256-`
# integrity attributes. `sha2` is the de-facto standard SHA-2 implementation;
# `base64` emits the canonical base64 encoding that browsers expect.
sha2 = "0.11"
base64 = "0.23"

# adr: ADR-0005 — `ureq` is the LLM transport. See docs/adr/0005-ureq-for-llm.md.
# Synchronous, blocking, pure-Rust HTTP client for the local-LLM content
# pipeline (`LlmPlugin`). Replaces the previous `curl` subprocess shellout
# (issue #520) so the AI plugin works on Windows runners without `curl.exe`,
# closes a shell-injection surface, and surfaces network failures as typed
# `SsgError` variants instead of stderr strings. Pure rustls — no native
# OpenSSL link, no tokio runtime — fits ssg's tokio-free Rayon-only
# architecture (ADR-0001).
ureq = { version = "2", default-features = false, features = ["json", "tls"] }

# adr: ADR-0003 — `lol_html` for all plugin HTML rewriting. See
# docs/adr/0003-lol_html-over-html5ever.md.
# Cloudflare's streaming HTML rewriter (issue #525). Pure Rust, zero-copy,
# CSS-selector driven — replaces the fragile `str::find` / `str::rfind`
# rewriting that previously lived in the image, search, CSP, and html-fix
# plugins. BSD-3-Clause (already allowed in deny.toml). No C deps.
lol_html = "3.0.0"

# adr: ADR-0001 — tokio-free; OS-event-driven watcher.
# Event-driven filesystem watcher for `ssg dev` (issue #526). Replaces the
# polling FileWatcher in src/server/watch.rs with OS-native FSEvents /
# inotify / ReadDirectoryChangesW so idle CPU is ~0% and edit-to-rebuild
# latency drops from the 1-2s polling interval to <50ms. CC0-1.0 (already
# allowed in deny.toml for tiny-keccak / const-random). Pulls only the
# default macOS fsevent backend on Darwin, inotify on Linux,
# ReadDirectoryChangesW on Windows — no tokio, no async runtime.
notify = "8"

# adr: ADR-0004 — sync `tungstenite` for HMR fan-out (supersession planned
# in v0.0.48 #571). See docs/adr/0004-sync-tungstenite-for-hmr.md.
# Sync WebSocket implementation for the HMR broadcaster (issue #526).
# Used by `HmrBroadcaster` to push hmr-html / hmr-css / reload frames
# to every connected dev-browser tab. No tokio — the broadcaster fans
# out from a std::thread::spawn loop reading from a std::sync::mpsc
# channel, matching ssg's tokio-free Rayon architecture (ADR-0001).
tungstenite = "0.30"


# Optional dependencies (feature-gated)
fail = { version = "0.5", optional = true }
tempfile = { version = "3.27.0", optional = true }
minijinja = { version = "2", optional = true, features = ["loader"] }
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
# AVIF encoding (issue #521). Pure-Rust rav1e-backed encoder; pulls
# `rgb` and `imgref` types we feed from `image::DynamicImage`. The
# `threading` default feature wires `rayon` for parallel tile encoding
# — matches our rayon-based build pipeline. No C dependencies.
ravif = { version = "0.13", optional = true, default-features = false, features = ["threading"] }
rgb = { version = "0.8", optional = true }

# Native HTML / JS / CSS minification (feature = "minify", issue #519).
# Versions pinned to those already resolved transitively via
# staticdatagen to keep the dependency graph tight.
minify-html = { version = "0.18.1", optional = true }
oxc_minifier = { version = "0.146.0", optional = true }
oxc_parser = { version = "0.146.0", optional = true }
oxc_codegen = { version = "0.146.0", optional = true }
oxc_allocator = { version = "0.146.0", optional = true }
oxc_span = { version = "0.146.0", optional = true }
lightningcss = { version = "1.0.0-alpha.71", optional = true }
walkdir = { version = "2.5", optional = true }

# Owned crate for frontmatter parsing
frontmatter-gen = "0.0.10"

# Pure-Rust YAML parser for data/*.{yml,yaml} files loaded into
# template globals (issue #536). The previous implementation parsed
# YAML through `serde_json`, which silently dropped any non-JSON
# YAML — indented lists, flow lists, nested maps. `noyalib` is a
# from-scratch YAML implementation (same author, same crate used by
# `ssg-core`'s frontmatter parser) — zero unsafe, no C deps, and
# deliberately carries no dependency on the unmaintained `serde_yaml`
# lineage `serde_yaml_ng` forked from.
noyalib = "0.0.19"

# Optional observability stack (issue #422). Both crates are
# `optional = true` — they enter the build only when the `otel`
# feature is enabled. The `dep:` references in the [features]
# section above wire them up. The OTLP/Jaeger exporter bridge
# (tracing-opentelemetry + opentelemetry_sdk) is deliberately
# deferred — it would pull `tokio` and `rt-tokio` into the
# dependency graph and the rest of SSG is rayon-based.
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter", "fmt", "json"] }

# -----------------------------------------------------------------------------
# Criterion Benchmark
# -----------------------------------------------------------------------------
# benches/bench.rs is the umbrella entry — it `mod`s the per-area files
# and lists their criterion groups as targets. Adding new bench files
# requires both a `mod` line and a target entry in bench.rs (NOT a new
# [[bench]] section here — those would collide with bench.rs's
# criterion_main!).
[[bench]]
name = "bench"
harness = false

# HTML scanning paths that moved to a parser in #539/#540/#570. Tracks the
# throughput cost of correctness so it stays a number, not a surprise.
[[bench]]
name = "bench_html_scanning"
harness = false

# AVIF-vs-WebP encoder comparison (issue #521 AC3). Standalone bench
# rather than a sibling of `plugins/og_image.rs` because criterion
# `bench_function`s rooted at the workspace top-level are what the
# acceptance command runs (`cargo bench --features image-optimization
# avif_vs_webp`). Requires `image-optimization` for `encode_avif`.
[[bench]]
name = "avif_vs_webp"
harness = false
required-features = ["image-optimization"]

# Issue #524 acceptance bench: ssg build --incremental warm-cache
# rebuild ≤ 200ms on a 1000-page fixture. Standalone target so the AC
# command (`cargo bench --bench incremental_1000_pages`) routes to a
# single criterion_main without dragging in the unrelated suites.
[[bench]]
name = "incremental_1000_pages"
harness = false
required-features = ["benchmark"]

# Master harness covering every public function in the ssg workspace
# (issue #533 follow-up). Smoke-runs with `cargo bench --bench
# all_pub_api -- --test`; full criterion run with no `--test`.
[[bench]]
name = "all_pub_api"
harness = false

# -----------------------------------------------------------------------------
# Module-mirror harnesses: one explicit entry per `src/<group>/` folder.
# Each binary's `main.rs` declares the per-module submodules under it; see
# `tests/core/main.rs` for the canonical layout commentary.
# -----------------------------------------------------------------------------
[[test]]
name = "core"
path = "tests/core/main.rs"

[[bench]]
name = "core"
path = "benches/core/main.rs"

[[test]]
name = "plugins"
path = "tests/plugins/main.rs"

[[bench]]
name = "plugins"
path = "benches/plugins/main.rs"

[[test]]
name = "server"
path = "tests/server/main.rs"

[[test]]
name = "cmd"
path = "tests/cmd/main.rs"

