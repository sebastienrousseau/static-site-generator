[[audits.staticdatagen]]
who = "Sebastien Rousseau <sebastian.rousseau@gmail.com>"
criteria = "safe-to-deploy"
version = "0.0.9"
notes = "Same-author crate, reviewed from the exact published crates.io source (37 files). #![forbid(unsafe_code)]; build.rs is a version_check rustc-version gate only; no network. Finding disclosed: macros/shell_macros.rs exposes CommandExecutor, an opt-in API that runs caller-supplied strings via `sh -c` with an explicit no-sanitization warning in its docs. It executes nothing on its own, is not reachable from ssg's build pipeline (ssg CI enforces a no-shellout lint), and is safe as long as callers pass trusted strings. fs::remove_dir_all calls operate only on caller-supplied directories (public_dir cleanup)."

[[audits.staticdatagen]]
who = "Sebastien Rousseau <sebastian.rousseau@gmail.com>"
criteria = "safe-to-deploy"
delta = "0.0.9 -> 0.0.10"
notes = "Delta review of the v0.0.10 release (2026-06-28, PR #72) against the fully-audited 0.0.9 baseline, performed 2026-07-03/04 from the local checkout fast-forwarded to the released tag while preparing the 0.0.11 fixes. Delta closes upstream #67-#71: compiler/service.rs staging simplifications, recursive nested-locale content walk, staticweaver 0.0.3 + rss-gen 0.0.6 dep bumps. No new unsafe, no new build.rs logic, no new network or process-spawn surface in the delta; the pre-existing opt-in CommandExecutor caveat from the 0.0.9 audit is unchanged."

[[audits.staticweaver]]
who = "Sebastien Rousseau <sebastian.rousseau@gmail.com>"
criteria = "safe-to-deploy"
version = "0.0.2"
notes = "Same-author crate, reviewed from the exact published crates.io source. #![forbid(unsafe_code)]; no build.rs; zero unsafe blocks; no process spawning; no fs deletion. Network access exists only behind the non-default `remote-templates` feature (reqwest GET of a caller-supplied template URL with 10 s timeout, 1 MiB body cap, and content-type check); staticdatagen 0.0.9 consumes it with default features, so no network code is compiled into this workspace."

