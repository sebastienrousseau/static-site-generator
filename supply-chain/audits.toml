criteria = "safe-to-deploy"
version = "0.0.6"
notes = "Same-author crate, reviewed from the exact published crates.io source. #![forbid(unsafe_code)]; build.rs is a version_check rustc-version gate only; no network, no process spawning, no proc-macro. std::env reads are documented config knobs (MAX_FRONTMATTER_SIZE, MAX_NESTING_DEPTH, VALIDATE_STRUCTURE) with parse-or-default fallback. Filesystem removal (ssg.rs remove_dir_all) is limited to the caller-supplied output_dir."

[[audits.html-generator]]
who = "Sebastien Rousseau <sebastian.rousseau@gmail.com>"
criteria = "safe-to-deploy"
version = "0.0.3"
notes = "Same-author crate, reviewed from the exact published crates.io source. Zero unsafe blocks (no forbid attribute, but the only `unsafe` grep hits are comrak's render.unsafe_ flag); build.rs is a version_check rustc-version gate only; no network, no process spawning, no env access, no fs deletion. Caveat disclosed: comrak raw-HTML passthrough (render.unsafe_ = true) is unconditionally enabled in this version — safe for trusted own-content markdown (ssg's use), but callers feeding untrusted markdown must sanitize downstream."

[[audits.html-generator]]
who = "Sebastien Rousseau <sebastian.rousseau@gmail.com>"
criteria = "safe-to-deploy"
version = "0.0.6"
notes = "Same-author crate, reviewed from the exact published crates.io source. #![forbid(unsafe_code)]; build.rs is a version_check rustc-version gate only; no network, no process spawning, no fs deletion. Raw-HTML passthrough is opt-in (allow_unsafe_html defaults to false) with ammonia sanitization available. Single env read (HTML_GENERATOR_EMOJI_DATA) loads an alternate emoji dataset from a caller-controlled path, falling back to the bundled include_str! data."

[[audits.http-handle]]
who = "Sebastien Rousseau <sebastian.rousseau@gmail.com>"
criteria = "safe-to-deploy"
version = "0.0.4"
notes = "Same-author crate (AGPL-3.0; consumed by ssg's dev-server path only, never linked into build output). Reviewed from the exact published crates.io source. build.rs is a version_check rustc-version gate only; no proc-macro; network use (std::net/tokio TCP) is the crate's declared purpose as an HTTP server. unsafe sites inspected individually: test-only std::env set_var/remove_var pairs, and one libc::sendfile FFI call (Linux-only, feature high-perf) with bounded chunk sizes and owned fds. EnvSecretProvider reads only explicitly namespaced env keys configured by the caller — no ambient credential harvesting."

[[audits.http-handle]]
who = "Sebastien Rousseau <sebastian.rousseau@gmail.com>"
criteria = "safe-to-deploy"
version = "0.0.5"
notes = "Same-author crate (AGPL-3.0; dev-server-only in ssg). Reviewed from the exact published crates.io source. #![deny(unsafe_code)] with documented, safety-commented allow sites: the Linux sendfile FFI path and Rust-2024 test-only env mutations. build.rs is a version_check rustc-version gate only; network use is the declared HTTP-server function; no process spawning; no ambient credential access."

