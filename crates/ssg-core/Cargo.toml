[package]
name = "ssg-core"
version = "0.0.62"
edition = "2021"
rust-version = "1.88.0"
license = "MIT OR Apache-2.0"
description = "Core compilation pipeline for SSG — no system dependencies, WASM-compatible."
repository = "https://github.com/sebastienrousseau/static-site-generator"
keywords = ["ssg", "static", "markdown", "wasm", "core"]
categories = ["web-programming", "template-engine", "wasm"]
readme = "../../README.md"

[dependencies]
log = "0.4"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pure-Rust YAML parser for frontmatter (issue #537). The previous
# hand-rolled split-on-colon parser stored every value as a string
# and silently dropped lists, flow lists, and nested maps —
# `tags:\n  - welcome` became the literal string "" under the key
# "tags". `noyalib` is a from-scratch YAML implementation (not a
# `serde_yaml` fork) — zero unsafe, no C deps, deliberately no
# dependency on the unmaintained `serde_yaml` lineage, clean on
# `wasm32-unknown-unknown`.
noyalib = "0.0.37"
sha2 = { version = "0.11", default-features = false }
toml = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
