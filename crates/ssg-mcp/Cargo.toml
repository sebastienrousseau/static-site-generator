[package]
name = "ssg-mcp"
version = "0.0.61"
edition = "2021"
rust-version = "1.88.0"
description = "Model Context Protocol stdio server exposing ssg's RPC surface as MCP tools."
license = "MIT OR Apache-2.0"
repository = "https://github.com/sebastienrousseau/static-site-generator"
keywords = ["mcp", "json-rpc", "ssg", "tools"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
documentation = "https://docs.rs/ssg-mcp"
homepage = "https://staticsitegenerator.com"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssg-rpc = { path = "../ssg-rpc", version = "0.0.61" }

[dev-dependencies]
schemars = { version = "1.2", default-features = false, features = ["derive", "std"] }

[lints]
workspace = true
