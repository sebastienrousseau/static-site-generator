[package]
name = "ssg-wasm"
version = "0.0.61"
edition = "2021"
rust-version = "1.88.0"
license = "MIT OR Apache-2.0"
description = "WebAssembly bindings for ssg-core — run SSG in the browser or at the edge."
repository = "https://github.com/sebastienrousseau/static-site-generator"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ssg-core = { path = "../ssg-core" }
# Edge RPC dispatcher (issue #548). Re-exported through a tiny
# wasm-bindgen shim (`rpc_dispatch`) so the Worker can call into
# any `#[ssg_rpc]`-annotated function without pulling the macro
# crate into the WASM build itself.
ssg-rpc = { path = "../ssg-rpc" }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
serde_json = "1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dev-dependencies]
js-sys = "0.3"
wasm-bindgen-test = "0.3"

[lints]
workspace = true
